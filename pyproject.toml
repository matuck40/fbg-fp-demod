[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fbg-fp-demod"
version = "0.1.0"
description = "Fabry-Perot and FBG peak-tracking demodulation for fibre-optic sensors"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucca de Carvalho Matuck", email = "luccamatuck@gmail.com" }]
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["fbgfp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
